name: Rebuild log index

on:
  push:
    branches: [main]
    paths:
      - 'logs/**'
      - 'minutes/**'
      - 'docs/**'
      - 'scripts/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so first/last commit dates are accurate

      - name: Build content/index.json
        run: python3 scripts/build_index.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- content/index.json; then
            echo "Index unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/index.json
          git commit -m "Rebuild log index [skip ci]"
          git push
